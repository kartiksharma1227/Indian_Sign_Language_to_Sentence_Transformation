services:
  - type: web
    name: isl-translator
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      apt-get update || true
      apt-get install -y libglib2.0-0 libsm6 libxrender1 libxext6 libgomp1 || true
      pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0